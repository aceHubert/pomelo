# version: '3.1'

services:
  database:
    image: mysql:5.7
    restart: always
    container_name: pomelo-mysql
    volumes:
      - ${PWD}/mysql/conf.d:/etc/mysql/conf.d
      - ${PWD}/mysql/data:/var/lib/mysql
      - ${PWD}/mysql:/logs
    privileged: true
    # ports:
    #   - "3336:3306"
    #   - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: ${DATABASE_NAME:-po_template}
      MYSQL_USER: ${DATABASE_USER:-pomelo}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
  redis:
    # Adjust the build context to your needs targetting the created Dockerfile
    build:
      context: ./redis
      dockerfile: Dockerfile
    image: redis:7.2-alpine
    restart: always
    container_name: pomelo-redis
    # Run the init script
    command: sh -c "./init.sh"
    # command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    privileged: true
    # ports:
    #   - "16379:6379"
    #   - "127.0.0.1:6379:6379"
    volumes:
      - ${PWD}/redis/conf:/usr/local/etc/redis
      - ${PWD}/redis/data:/data
  server:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        BUILD_PLATFORM: ${BUILD_PLATFORM:-linux/amd64}
        BUILD_IGNORE: ${BUILD_IGNORE:-false} # ignore exectuing build in Dockerfile
        BUILD_OPTION: ${BUILD_OPTION:-yarn build:web && yarn build:infrastructures} # build command
        RUNTIME_ENV: ${RUNTIME_ENV:-production} # runtime env, production | development
        SERVE_PM2_ENV: ${SERVE_PM2_ENV:-production} # env in ecosystem.config.js
        SERVE_PM2_CONFIG: ${SERVE_PM2_CONFIG:-ecosystem.config.js} # pm2 config file
        BUILDKIT_INLINE_CACHE: true
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: true
      cache_from:
        - pomelo:latest
      target: deploy
      tags:
        - pomelo:${BUILD_TAG:-latest}
    image: pomelo:latest
    container_name: pomelo-server
    restart: always
    environment:
      - SWAGGER_DEBUG=${SWAGGER_DEBUG:-false}
      - GRAPHQL_DEBUG=${GRAPHQL_DEBUG:-false}
      - REDIS_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@redis:${REDIS_PORT:-6379}/${REDIS_DB:-0}
      - INFRASTRUCTURE_DATABASE_CONNECTION=mysql://${MYSQL_USER:-pomelo}:${MYSQL_PASSWORD}@database:${MYSQL_PORT:-3306}/${INFRASTRUCTURE_DATABASE_NAME:-po_template}
      - TABLE_PREFIX=${TABLE_PREFIX:-po_}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${PWD}/conf:/app/conf
      - ${PWD}/uploads:/app/content/uploads
      - ${PWD}/plugins:/app/content/plugins
      - ${PWD}/themes:/app/content/themes
      - ${PWD}/logs:/app/logs
    privileged: true
    depends_on:
      - database
      - redis
    ports:
      - "${POMERO_WEB_HOST_PORT:-10080}:80" # web
      - "${POMERO_INFRASTRUCTURE_SERVICE_HOST_PORT:-13000}:3000" # infrastructure service http
      - "${POMERO_INFRASTRUCTURE_SERVICE_TCP_HOST_PORT:-13001}:3001" # infrastructure service tcp
      - "${POMERO_BFF_SERVER_HOST_PORT:-13002}:3002" # bff server
    networks:
      - default
  identity-server:
    build:
      context: ../
      dockerfile: Dockerfile.oidc
      args:
        BUILD_PLATFORM: ${BUILD_PLATFORM:-linux/amd64}
        BUILD_IGNORE: ${OIDC_BUILD_IGNORE:-false}
        BUILD_OPTION: ${OIDC_BUILD_OPTION:-yarn build:identity-server}
        RUNTIME_ENV: ${RUNTIME_ENV:-production}
        BUILDKIT_INLINE_CACHE: true
        BUILDKIT_CONTEXT_KEEP_GIT_DIR: true
      cache_from:
        - pomelo-oidc:latest
      target: deploy
      tags:
        - pomelo-oidc:${BUILD_TAG:-latest}
    image: pomelo-oidc:latest
    container_name: pomelo-identity-server
    restart: always
    environment:
      - SWAGGER_DEBUG=${SWAGGER_DEBUG:-false}
      - GRAPHQL_DEBUG=${GRAPHQL_DEBUG:-false}
      - ACCOUNT_PROVIDER=${ACCOUNT_PROVIDER:-direct-db}
      - IDENTITY_DATABASE_CONNECTION=mysql://${MYSQL_USER:-pomelo}:${MYSQL_PASSWORD}@database:${MYSQL_PORT:-3306}/${IDENTITY_DATABASE_NAME:-po_template}
      - TABLE_PREFIX=${TABLE_PREFIX:-po_}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ${PWD}/conf:/app/conf
      - ${PWD}/logs:/app/logs
    privileged: true
    depends_on:
      - database
    networks:
      - default
  apisix:
    image: apache/apisix:3.13.0-debian
    container_name: pomelo-apisix
    restart: always
    environment:
      - APISIX_STAND_ALONE=true
    volumes:
      - ${PWD}/apisix/conf/apisix-standalone.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ${PWD}/apisix/conf/config-standalone.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ${PWD}/apisix:/usr/local/apisix/logs
    privileged: true
    depends_on:
      - server
      - identity-server
    ##network_mode: host
    # ports:
    # - '9180:9180/tcp' # admin_control: true
    # - "9080:9080/tcp" # http
    # - '9091:9091/tcp'  # prometheus
    # - "9443:9443/tcp" # tls http/2
    # - '9092:9092/tcp' # enable_control: true
    networks:
      - default
